name: Refresh KMA cache (base — short + mid + observation)

# 단기 + 중기 + 전일 ASOS 관측 갱신. 매 1시간 정시 (:05).
# 단기는 3시간마다, 중기는 6시간마다 발표라 1시간 주기면 충분.

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      cities:
        description: 'Cities (comma-separated). 비우면 전국 광역시·도 17개 전체.'
        required: false
        type: string
        default: ''

permissions:
  id-token: write   # OIDC for GCP WIF

concurrency:
  group: refresh-kma-base
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'worker/uv.lock'

      - name: Setup Python
        run: uv python install 3.12
        working-directory: worker

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: worker

      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Refresh KMA cache (base — short + mid + observation)
        working-directory: worker
        env:
          KMA_OPENAPI_KEY: ${{ secrets.KMA_OPENAPI_KEY }}
          KMA_APIHUB_KEY: ${{ secrets.KMA_APIHUB_KEY }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          uv run python refresh_kma.py \
            --mode base \
            --cities "${{ inputs.cities }}"
