name: Generate Record Reminder

on:
  schedule:
    # 매일 06:00 KST (21:00 UTC) — 그날 19:00 리마인더보다 충분히 이른 시각에
    # 문구 풀을 만들어 Firestore에 올려둔다. 앱은 진입 시 받아서 19:00 로컬 예약.
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: '생성할 문구 개수'
        required: false
        type: string
        default: '10'

permissions:
  id-token: write   # OIDC for GCP WIF

concurrency:
  group: generate-record-reminder
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: 'worker/uv.lock'

      - name: Setup Python
        run: uv python install 3.12
        working-directory: worker

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: worker

      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Generate reminder messages
        working-directory: worker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          uv run python gen_record_reminder.py --count "${{ inputs.count || '10' }}"
