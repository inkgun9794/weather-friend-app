name: Generate Hourly Briefing

on:
  schedule:
    # 매 15분 (UTC) — GitHub Actions public repo의 cron은 평균 6%만 실행되어 (high
    # load 시 dropped), 자주 시도해서 누락을 빨리 따라잡음. `:45` 즈음 cron이 다음
    # hour 슬롯을 미리 생성하도록 main.py의 fill-today가 _next_target_hour()까지 처리.
    # fill-today는 idempotent라 중복 cron이 발사되어도 Gemini 호출은 시간당 1번만.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      target_hour:
        description: 'Target hour 0-23 (KST). 비워두면 자동 계산.'
        required: false
        type: string
      cities:
        description: 'Cities (comma-separated). 기본: seoul'
        required: false
        type: string
        default: 'seoul'

permissions:
  id-token: write   # OIDC for GCP WIF
  contents: write   # docs/ commit & push for Pages

concurrency:
  # 동일 시간대 중복 실행 방지 (workflow_dispatch와 cron이 겹칠 때)
  group: generate-briefing
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # TODO: 모든 action을 commit SHA로 핀(pin) — Dependabot이 자동 PR 생성하면 SHA로 전환
      # 현재는 빠른 셋업을 위해 메이저 버전 태그 사용
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'worker/uv.lock'

      - name: Setup Python
        run: uv python install 3.12
        working-directory: worker

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: worker

      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Generate briefing
        working-directory: worker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TYPECAST_API_KEY: ${{ secrets.TYPECAST_API_KEY }}
          TYPECAST_API_KEY_B: ${{ secrets.TYPECAST_API_KEY_B }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          if [ -n "${{ inputs.target_hour }}" ]; then
            # Manual single-hour run
            uv run python main.py \
              --cities "${{ inputs.cities || 'seoul' }}" \
              --target-hour "${{ inputs.target_hour }}" \
              --docs-root ../docs
          else
            # Default: backfill any empty slots from 00시 to now (KST).
            # Idempotent — already-saved slots are skipped.
            uv run python main.py \
              --cities "${{ inputs.cities || 'seoul' }}" \
              --fill-today \
              --docs-root ../docs
          fi

      - name: Commit & push audio files (for GitHub Pages)
        # 일부 hour가 fail해도 (예: Gemini 503) 성공한 hour의 mp3는 publish해야 함.
        # 기본 if: success()라면 generate step exit 1일 때 skip되어 mp3가 게시 안 됨.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No audio file changes (likely a HOURLY slot — no audio generated)."
          else
            git commit -m "chore(audio): briefing $(date -u +'%Y-%m-%d %H:%M UTC')"
            # 사용자/다른 cron의 동시 push와 race condition 대응:
            # pull --rebase로 원격 최신 위에 우리 commit 다시 쌓고 push. 3회 retry.
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then
                echo "✓ Pushed on attempt $attempt"
                exit 0
              fi
              echo "Push attempt $attempt failed, retrying in 5s..."
              sleep 5
            done
            echo "✗ Push failed after 3 attempts"
            exit 1
          fi
