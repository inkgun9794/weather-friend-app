name: Build Korea grid mask (one-shot)

# 한반도 영역 mask 생성 — 일회성. 한 번 실행해서 Firestore에 저장하면 끝.
# 한반도 영역 격자는 변하지 않으므로 재실행 필요 없음.

on:
  workflow_dispatch:

permissions:
  id-token: write   # OIDC for GCP WIF

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'worker/uv.lock'

      - name: Setup Python
        run: uv python install 3.12
        working-directory: worker

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: worker

      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Build Korea mask
        working-directory: worker
        env:
          KMA_APIHUB_KEY: ${{ secrets.KMA_APIHUB_KEY }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: uv run python scripts/build_korea_mask.py
