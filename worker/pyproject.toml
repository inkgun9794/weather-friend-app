[project]
name = "weather-friend-worker"
version = "0.1.0"
description = "Daily weather briefing generator for 날사친"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0.0",
    "google-cloud-firestore>=2.20.0",
    "firebase-admin>=6.5.0",
    "httpx>=0.27.0",
    "pydantic>=2.10.0",
    "Pillow>=10.0.0",
    "numpy>=2.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=9.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
